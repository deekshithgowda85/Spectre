spring.cloud.gateway.server.webflux.routes[2].id=dashboard-service
spring.cloud.gateway.server.webflux.routes[2].uri=${DASHBOARD_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/dashboard/**
spring.cloud.gateway.server.webflux.routes[6].id=project-service
spring.cloud.gateway.server.webflux.routes[6].uri=${DASHBOARD_SERVICE_URL:http://localhost:8083}
