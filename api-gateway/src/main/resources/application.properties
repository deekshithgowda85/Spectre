spring.application.name=api-gateway
spring.docker.compose.enabled=false
server.port=${GATEWAY_PORT:8080}
logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=DEBUG
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=incident-service
spring.cloud.gateway.server.webflux.routes[1].uri=${INCIDENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/incidents/**
spring.cloud.gateway.server.webflux.routes[7].id=signals-service
spring.cloud.gateway.server.webflux.routes[7].uri=${INCIDENT_SERVICE_URL:http://localhost:8082}
