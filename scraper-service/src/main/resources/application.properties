spring.application.name=scraper-service
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
server.port=${SCRAPER_SERVICE_PORT:8086}
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost/scraper}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
JWT_SECRET=${JWT_SECRET}
scraper.scheduler-tick-ms=${SCRAPER_SCHEDULER_TICK_MS:1000}
scraper.http-timeout-ms=${SCRAPER_HTTP_TIMEOUT_MS:5000}
scraper.targets[0].service-name=${SCRAPER_TARGET_0_SERVICE_NAME:}
scraper.targets[0].metrics-url=${SCRAPER_TARGET_0_METRICS_URL:}
scraper.targets[0].interval-ms=${SCRAPER_TARGET_0_INTERVAL_MS:60000}
