spring.application.name=incident-service
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
server.port=${INCIDENT_SERVICE_PORT:8082}
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=${DATABASE_SSLMODE:require}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
JWT_SECRET=${JWT_SECRET}
incident.correlation-window-minutes=${INCIDENT_CORRELATION_WINDOW_MINUTES:30}
incident.anomaly-url=${ANOMALY_SERVICE_URL:http://localhost:8085}
incident.service-token=${INCIDENT_SERVICE_TOKEN:}
incident.scheduler-tick-ms=${INCIDENT_SCHEDULER_TICK_MS:10000}
