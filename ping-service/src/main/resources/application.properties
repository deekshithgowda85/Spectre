spring.application.name=ping-service
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
server.port=${PING_SERVICE_PORT:8084}
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost/ping}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
JWT_SECRET=${JWT_SECRET}
ping.scheduler-tick-ms=${PING_SCHEDULER_TICK_MS:1000}
ping.http-timeout-ms=${PING_HTTP_TIMEOUT_MS:5000}
ping.targets[0].name=${PING_TARGET_0_NAME:}
ping.targets[0].url=${PING_TARGET_0_URL:}
ping.targets[0].interval-ms=${PING_TARGET_0_INTERVAL_MS:60000}
