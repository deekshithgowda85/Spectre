spring.application.name=anomaly-service
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
server.port=${ANOMALY_SERVICE_PORT:8085}
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost/anomaly}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
JWT_SECRET=${JWT_SECRET}
anomaly.scheduler-tick-ms=${ANOMALY_SCHEDULER_TICK_MS:10000}
anomaly.scraper-url=${SCRAPER_SERVICE_URL:http://localhost:8086}
anomaly.ping-url=${PING_SERVICE_URL:http://localhost:8084}
anomaly.service-token=${ANOMALY_SERVICE_TOKEN:}
anomaly.monitored-services=${ANOMALY_MONITORED_SERVICES:}
anomaly.response-time-threshold-ms=${ANOMALY_RESPONSE_TIME_THRESHOLD_MS:1000}
anomaly.error-rate-threshold=${ANOMALY_ERROR_RATE_THRESHOLD:0.05}
anomaly.consecutive-samples=${ANOMALY_CONSECUTIVE_SAMPLES:3}
