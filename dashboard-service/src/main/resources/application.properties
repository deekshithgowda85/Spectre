spring.application.name=dashboard-service
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
server.port=${DASHBOARD_SERVICE_PORT:8083}
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5433/spectra?sslmode=disable}
spring.datasource.username=${DATABASE_USERNAME:spectra}
spring.datasource.password=${DATABASE_PASSWORD:spectra}
spring.datasource.hikari.data-source-properties.sslmode=${DATABASE_SSLMODE:require}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-32-characters}
